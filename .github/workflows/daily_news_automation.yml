name: Daily Uttarakhand News Automation

on:
  schedule:
    # 04:30 UTC = 10:00 AM IST
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Create Google service-account file
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON_B64" | base64 --decode > service-account.json
          chmod 600 service-account.json

      - name: Run Amar Ujala automation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ./service-account.json
          RSS_URL: https://www.amarujala.com/rss/uttarakhand.xml
          SHEET_NAME: Sheet1
          LOOKBACK_HOURS: '30'
          TIMEZONE: Asia/Kolkata
        run: python amar_ujala_to_sheets.py

      - name: Remove credentials
        if: always()
        run: rm -f service-account.json
